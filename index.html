<title>Lembap</title>

<style>
/* Layout: aplikasi satu lajur gaya iOS, tajuk besar, tab bar bawah, kad boleh kembang (details).
   Palet: neutral ungu-merah jambu pucat, aksen raspberi, AM kuning-amber, PM indigo. */
:root{
  --bg:#f6f1f5; --surface:#ffffff; --surface-2:#f1e9f0; --ink:#2b1c31; --muted:#75657b; --line:#e8dce6;
  --accent:#b8325f; --accent-ink:#ffffff; --accent-soft:#fbe2eb;
  --am:#a8650b; --am-soft:#fbeed6; --pm:#5646a0; --pm-soft:#e8e4f6;
  --ok:#23805a; --ok-soft:#dcf2e8; --warn:#9a5a08; --warn-soft:#fbecd0;
  --font-display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#170f1c; --surface:#231a29; --surface-2:#2d2234; --ink:#f5ecf7; --muted:#b4a2bb; --line:#3b2e44;
    --accent:#ff7ba5; --accent-ink:#2b0f1c; --accent-soft:#43202f;
    --am:#f0b35a; --am-soft:#3d2c12; --pm:#b8abff; --pm-soft:#2c2650;
    --ok:#6fd6a6; --ok-soft:#17382b; --warn:#f0b35a; --warn-soft:#3d2c12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#170f1c; --surface:#231a29; --surface-2:#2d2234; --ink:#f5ecf7; --muted:#b4a2bb; --line:#3b2e44;
  --accent:#ff7ba5; --accent-ink:#2b0f1c; --accent-soft:#43202f;
  --am:#f0b35a; --am-soft:#3d2c12; --pm:#b8abff; --pm-soft:#2c2650;
  --ok:#6fd6a6; --ok-soft:#17382b; --warn:#f0b35a; --warn-soft:#3d2c12;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:8px;padding-bottom:104px}
/* Latar aurora: kabus warna lembut, mengikut tema */
body::before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 36% at 12% 6%, color-mix(in srgb,var(--accent) 30%,transparent), transparent 72%),
    radial-gradient(42% 34% at 94% 18%, color-mix(in srgb,var(--pm) 28%,transparent), transparent 72%),
    radial-gradient(52% 38% at 80% 78%, color-mix(in srgb,var(--am) 22%,transparent), transparent 74%),
    radial-gradient(46% 36% at 6% 92%, color-mix(in srgb,var(--accent) 22%,transparent), transparent 72%);
  animation:aurora 22s ease-in-out infinite alternate;will-change:transform}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(color-mix(in srgb,var(--ink) 7%,transparent) 1px,transparent 1.4px) 0 0/22px 22px;
  -webkit-mask-image:linear-gradient(to bottom,#000,transparent 55%);mask-image:linear-gradient(to bottom,#000,transparent 55%)}
@keyframes aurora{from{transform:translate3d(-2%,-1.5%,0) scale(1)}to{transform:translate3d(2.5%,2%,0) scale(1.12)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{max-width:560px;margin:0 auto;min-width:0}
h1,h2,h3,p,ol,ul,dl{margin:0}
.lt{font-family:var(--font-display);font-weight:400;font-size:44px;line-height:1.02;margin:22px 0 4px;text-wrap:balance}
.lt em{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:26px 4px 10px}
.card{background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border:1px solid color-mix(in srgb,var(--surface) 70%,var(--line));border-radius:18px;box-shadow:0 6px 24px -14px color-mix(in srgb,var(--accent) 45%,transparent)}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;color:inherit}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:3px;border-radius:13px;background:var(--surface-2);margin:18px 0 14px}
.seg button{border:0;background:transparent;min-height:44px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(40,10,40,.16)}
.seg .dot{width:9px;height:9px;border-radius:50%}
.seg [data-mode="am"] .dot{background:var(--am)}
.seg [data-mode="pm"] .dot{background:var(--pm)}

/* progress */
.prog{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.prog-top b{font-size:15px}
.prog-top span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--accent);transition:width .35s ease}
.logic{font-size:13px;color:var(--muted)}

/* steps */
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.step summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px 12px 12px;min-height:68px}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:transparent;flex:none}
.chk svg{width:18px;height:18px}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.stx{display:flex;flex-direction:column;min-width:0}
.kicker{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:700}
.ptitle{font-weight:600;font-size:16px;line-height:1.3}
.brief{font-size:13.5px;color:var(--muted);line-height:1.35}
.chev{width:18px;height:18px;color:var(--muted);transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
.step.done .ptitle{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.sbody{padding:2px 16px 16px 58px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.kv span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sbody ol{padding-left:18px;display:flex;flex-direction:column;gap:5px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:13.5px}
.note.good{background:var(--ok-soft)}
.timer{align-self:flex-start;border:1px solid var(--line);background:var(--surface-2);border-radius:99px;min-height:40px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;font-variant-numeric:tabular-nums}
.timer.run{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.timer.fin{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

.cta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;text-decoration:none;color:inherit}
.cta b{display:block}
.cta .go{flex:none;background:var(--accent);color:var(--accent-ink);border-radius:99px;min-height:42px;padding:0 18px;display:grid;place-items:center;font-weight:700;font-size:14px;text-decoration:none}

/* makeup */
.when{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.when label{font-weight:600}
.when input{font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-variant-numeric:tabular-nums}
.lay summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-height:64px}
.num{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.lay .sbody{padding-left:56px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.am{background:var(--am-soft);color:var(--am)}
.chip.pm{background:var(--pm-soft);color:var(--pm)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.tl{position:relative;display:flex;flex-direction:column;gap:0;padding:6px 0}
.tp{display:grid;grid-template-columns:78px 18px minmax(0,1fr);gap:10px;padding:10px 14px 10px 14px}
.tp .t{font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;line-height:1.3}
.tp .t small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.rail{position:relative;display:flex;justify-content:center}
.rail::before{content:"";position:absolute;top:0;bottom:-20px;width:2px;background:var(--line)}
.tp:last-child .rail::before{bottom:auto;height:14px}
.rail i{position:relative;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:5px;box-shadow:0 0 0 4px var(--surface)}
.tp h3{font-size:15px;font-weight:600;line-height:1.3}
.tp p{font-size:13.5px;color:var(--muted);margin-top:2px}
.kit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:14px}
.kit div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.35}
.kit b{display:block;font-size:14px}

/* produk */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:99px;min-height:40px;padding:0 16px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 14px 14px 16px;min-height:72px}
.prod .ptitle{font-size:15.5px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.prod .sbody{padding:2px 16px 16px}
.prod h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:2px 0 -4px;font-weight:600}
.disc{font-size:12.5px;color:var(--muted);padding:4px 4px 0}

/* tip */
.rules{padding:6px 16px}
.rules li{list-style:none;padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:15px}
.rules li:last-child{border:0}
.rules b{color:var(--accent);font-family:var(--font-display);font-size:24px;line-height:1;font-weight:400}
.tip summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:14px 14px 14px 16px;min-height:60px}
.tip .sbody{padding:0 16px 16px}
.why{font-size:13.5px;color:var(--muted)}
.fix summary{padding:13px 14px 13px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:56px;font-weight:600}
.fix .sbody{padding:0 16px 16px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line)}
.tabbar div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
.tabbar a svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{color:var(--accent)}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.lt{font-size:38px}.sbody{padding-left:16px}.lay .sbody{padding-left:16px}.tp{grid-template-columns:64px 14px minmax(0,1fr)}}
</style>

function stepHTML(s,i,done){
  const d=!!done[s.id];
  return `<details class="step card${d?" done":""}" data-id="${s.id}">
    <summary><button class="chk" type="button" aria-pressed="${d}" aria-label="Tanda langkah ${i+1} siap">${ICON.check}</button>
    <span class="stx"><span class="kicker">Langkah ${i+1} · ${s.kick}</span><span class="ptitle">${s.name}</span><span class="brief">${s.brief}</span></span>${ICON.chev}</summary>
    <div class="sbody">
      <div class="kv"><span>Jumlah</span><b>${s.amount}</b></div>
      <ol>${s.how.map(h=>`<li>${h}</li>`).join("")}</ol>
      ${s.wait?`<button class="timer" type="button" data-sec="${s.wait}">Mula tunggu ${fmtTime(s.wait)}</button>`:""}
      ${s.note?`<p class="note">${s.note}</p>`:""}
    </div></details>`;
}

   </div>

     :`<div class="card cta"><div><b>Selesai. Tidur 7 hingga 8 jam.</b><span class="sub">Esok pagi, bilas ringkas dan teruskan rutin pagi.</span></div><a class="go" href="#tip">Tip MUA</a></div>`}`;
}
function updateProgress(){
  const m=state.mode,steps=ROUTINE[m],done=store.get(dayKey(m))||{};
  const n=steps.filter(s=>done[s.id]).length;
  const pc=document.getElementById("pc"),pb=document.getElementById("pb");
  if(pc)pc.textContent=n+" / "+steps.length+" langkah";
  if(pb)pb.style.width=Math.round(n/steps.length*100)+"%";
}

/* ---------- RENDER: MEKAP ---------- */
function clock(min){
  const h24=Math.floor(min/60)%24,mm=String(min%60).padStart(2,"0");
  const h12=h24%12===0?12:h24%12;
  const part=h24<12?"pagi":(h24<15?"tengah hari":(h24<19?"petang":"malam"));
  return {t:h12+":"+mm,p:part};
}
function timelineHTML(start){
  const [h,m]=start.split(":").map(Number);
  const base=(h||0)*60+(m||0);
  return CHECKS.map(c=>{const k=clock(base+c.m);
    return `<div class="tp"><div class="t">${k.t}<small>${k.p}${c.m?" · +"+(c.m/60)+" jam":" · mula"}</small></div><div class="rail"><i></i></div><div><h3>${c.t}</h3><p>${c.d}</p></div></div>`}).join("");
}

    <div class="sbody">
      <h4>Fungsi untuk kulit kering</h4><p>${p.role}</p>
      <h4>Cara guna</h4><ol>${p.how.map(h=>`<li>${h}</li>`).join("")}</ol>
      <div class="kv"><span>Jumlah</span><b>${p.amt}</b></div>
      <p class="note"><b>Elak:</b> ${p.avoid}</p>
      ${p.chk?`<p class="note good">${p.chk}</p>`:""}
    </div></details>`;
}
function renderProduk(){
  const f=state.filter;
  const list=PRODUCTS.filter(p=>f==="semua"||p.g===f);
  const btn=(k,l)=>`<button type="button" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`;
  view.innerHTML=`
   <h1 class="lt">Produk <em>anda</em></h1>
   <p class="sub">14 produk, dipecahkan mengikut fungsi.</p>
   <div class="filters">${btn("semua","Semua")}${btn("skin","Skincare")}${btn("mekap","Mekap")}</div>
   <div class="stack">${list.map(prodHTML).join("")}</div>
   <p class="disc">Panduan umum untuk jenis produk. Senarai bahan, shade dan varian sebenar ikut label. Buat ujian tampal (patch test) pada rahang untuk produk baharu. Jika ada ruam, pedih berterusan atau kulit sensitif, berhenti dan jumpa doktor kulit.</p>`;
}

/* ---------- RENDER: TIP ---------- */
function renderTip(){
  view.innerHTML=`
   <h1 class="lt">Tip <em>jurusolek</em></h1>
   <p class="sub">Teknik yang lazim digunakan jurusolek profesional untuk kulit kering.</p>
   <div class="sec">Lima peraturan</div>
   <ul class="card rules" style="padding-left:16px;padding-right:16px">${RULES.map((r,i)=>`<li><b>${i+1}</b><span>${r}</span></li>`).join("")}</ul>
   <div class="sec">Teknik</div>
   <div class="stack">${TIPS.map(t=>`
     <details class="tip card"><summary><span class="ptitle">${t.t}</span>${ICON.chev}</summary>
     <div class="sbody"><p>${t.b}</p><p class="why"><b>Kenapa berkesan:</b> ${t.w}</p></div></details>`).join("")}</div>
   <div class="sec">Bila ada masalah</div>
   <div class="stack">${FIXES.map(f=>`
     <details class="fix card"><summary><span>${f.q}</span>${ICON.chev}</summary><div class="sbody"><p>${f.a}</p></div></details>`).join("")}</div>
   <p class="disc">Teknik di atas ialah amalan lazim jurusolek profesional. Saya tidak mengaitkannya dengan nama individu tertentu kerana tidak dapat mengesahkan kutipan.</p>`;
}

/* ---------- ROUTER ---------- */
const TABS=["rutin","makeup","produk","tip"];
function route(){
  const h=(location.hash||"#rutin").slice(1);
  const t=TABS.includes(h)?h:"rutin";
  ({rutin:renderRutin,makeup:renderMakeup,produk:renderProduk,tip:renderTip})[t]();
  document.querySelectorAll(".tabbar a").forEach(a=>{
    if(a.dataset.tab===t)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);

/* ---------- EVENTS ---------- */
function startTimer(btn){
  clearInterval(btn._t);
  let left=parseInt(btn.dataset.sec,10);
  btn.classList.remove("fin");btn.classList.add("run");
  const tick=()=>{
    if(left<=0){clearInterval(btn._t);btn.classList.remove("run");btn.classList.add("fin");btn.textContent="Siap, boleh teruskan";return}
    btn.textContent="Tunggu "+fmtTime(left);left--;
  };
  tick();btn._t=setInterval(tick,1000);
}
view.addEventListener("click",e=>{
  const chk=e.target.closest(".chk");
  if(chk){
    e.preventDefault();
    const det=chk.closest(".step"),id=det.dataset.id,key=dayKey(state.mode);
    const done=store.get(key)||{};
    done[id]=!done[id];store.set(key,done);
    chk.setAttribute("aria-pressed",String(!!done[id]));
    det.classList.toggle("done",!!done[id]);
    updateProgress();return;
  }
  const tm=e.target.closest(".timer");
  if(tm){startTimer(tm);return}
  const md=e.target.closest("[data-mode]");
  if(md){state.mode=md.dataset.mode;renderRutin();return}
  const fl=e.target.closest("[data-filter]");
  if(fl){state.filter=fl.dataset.filter;renderProduk();return}
});
view.addEventListener("input",e=>{
  if(e.target.id==="startTime"&&e.target.value){
    store.set("lembap-start",e.target.value);
    document.getElementById("tl").innerHTML=timelineHTML(e.target.value);
  }
});

route();
})();
</script>

</body></html>
