<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kulit Kering · Dry Skin Beauty Routine</title>
<style>
:root{--card:#fff;--ink:#2b2226;--mute:#6f5f66;--pink:#d6336c;--soft:#fde4ec;--line:#f1d9e0;--g:#1f8a4c;--o:#b36b00;--r:#c92a2a;--veil:rgba(255,244,248,.84)}
@media (prefers-color-scheme:dark){:root{--card:#272024;--ink:#f4eaee;--mute:#b9a7ae;--pink:#ff7aa8;--soft:#3a2630;--line:#3d2f35;--g:#5fd08a;--o:#ffb454;--r:#ff8080;--veil:rgba(28,19,22,.86)}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:72px;min-height:100vh;background:#fdeaf2}
@media (prefers-color-scheme:dark){body{background:#1c1316}}
/* background collage of the user's own product photos */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bg .grid{position:absolute;inset:-10%;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;transform:rotate(-8deg) scale(1.15);padding:10px}
#bg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#fff;opacity:.9}
#bg::after{content:"";position:absolute;inset:0;background:
 radial-gradient(circle at 10% 5%,rgba(255,200,220,.7),transparent 45%),
 radial-gradient(circle at 95% 90%,rgba(232,213,255,.6),transparent 45%),
 var(--veil);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
header,main{position:relative;z-index:1}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:1.6rem;background:linear-gradient(90deg,var(--pink),#ff9a5a);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mute);font-size:.9rem}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);flex:none}
.lang button{border:0;background:none;padding:6px 12px;font:inherit;font-size:.8rem;font-weight:700;color:var(--mute);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--pink);color:#fff}
main{max-width:720px;margin:0 auto;padding:8px 16px}
nav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 4px;border:0;background:none;color:var(--mute);font:inherit;font-size:.85rem;cursor:pointer}
nav button[aria-selected=true]{color:var(--pink);font-weight:700}
section{display:none}section.on{display:block}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 8px}
.card{background:color-mix(in srgb,var(--card) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden;box-shadow:0 4px 16px rgba(214,51,108,.1)}
.card>summary{list-style:none;cursor:pointer;padding:10px 14px;display:flex;gap:12px;align-items:center}
.card>summary::-webkit-details-marker{display:none}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;background:#fff;border:1px solid var(--line)}
.brand{font-size:.75rem;color:var(--mute)}
.name{font-weight:600;line-height:1.3}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:4px}
.great{background:#1f8a4c22;color:var(--g)}.ok{background:#c7770022;color:var(--o)}.caution{background:#c92a2a22;color:var(--r)}
.body{padding:0 14px 14px;font-size:.92rem}
.body h3{font-size:.8rem;margin:12px 0 4px;color:var(--pink)}
.body ul{margin:0;padding-left:18px}
.note{color:var(--mute);font-size:.85rem}
.tip{background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:8px}
input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
label.step{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
label.step:first-of-type{border-top:0}
label.step input{margin-top:5px;accent-color:var(--pink);width:18px;height:18px;flex:none}
label.step.done .t{text-decoration:line-through;color:var(--mute)}
.p{color:var(--pink);font-size:.8rem}
.tipc{padding:12px 14px;border-top:1px solid var(--line)}.tipc:first-child{border-top:0}
.tipc b{display:block}.tipc span{color:var(--mute);font-size:.9rem}
.pics{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.mini{width:46px;height:46px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:#fff}
.sthumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;border:1px solid var(--line);background:#fff}
.disc{font-size:.8rem;color:var(--mute);margin:12px 0;background:color-mix(in srgb,var(--card) 80%,transparent);padding:8px 10px;border-radius:10px}
</style>

[["Tanda kulit perlu lebih kelembapan","Signs your skin needs more moisture"],["Rasa ketat selepas cuci muka, mengelupas, atau foundation mudah 'patchy'. Tambah satu lapisan hidrasi dan kurangkan produk aktif sementara.","Tightness after cleansing, flaking, or patchy foundation. Add a hydration layer and pause strong actives for a while."]]

let lang=0;try{lang=localStorage.getItem("kk-lang")==="en"?1:0}catch(e){}

const li=a=>"<ul>"+a.map(x=>"<li>"+esc(tx(x))+"</li>").join("")+"</ul>";
const $=id=>document.getElementById(id);
function renderP(){
 const q=$("q").value.toLowerCase();let h="";
 CAT.forEach((c,ci)=>{const it=P.filter(p=>p.c===ci&&(p.b+" "+p.n).toLowerCase().includes(q));if(!it.length)return;
  h+="<h2>"+esc(tx(c))+"</h2>"+it.map(p=>`<details class="card"><summary><img class="thumb" src="${IMG[p.id]}" alt="${esc(p.b+" "+p.n)}" loading="lazy"><div><div class="brand">${esc(p.b)} · ${esc(p.s)} · ${esc(p.u)}</div><div class="name">${esc(p.n)}</div><span class="badge ${p.f}">${esc(tx(FIT[p.f]))}</span></div></summary><div class="body"><h3>${esc(tx(UI.ben))}</h3>${li(p.ben)}<h3>${esc(tx(UI.ing))}</h3>${p.ing.length?li(p.ing):`<div class="note">${esc(tx(UI.noing))}</div>`}<div class="note">${esc(tx(p.note))}</div><div class="tip">💡 ${esc(tx(p.tip))}</div></div></details>`).join("")});
 $("plist").innerHTML=h||`<p class="note">${esc(tx(UI.none))}</p>`}
let done=new Set();const today=new Date().toISOString().slice(0,10);
try{const d=JSON.parse(localStorage.getItem("kk")||"{}");if(d.date===today)done=new Set(d.ids)}catch(e){}
const save=()=>{try{localStorage.setItem("kk",JSON.stringify({date:today,ids:[...done]}))}catch(e){}};
function renderR(){
 $("rlist").innerHTML=R.map(s=>`<h2>${esc(tx(s.t))}</h2><div class="card">`+s.s.map(([id,t,pid,n])=>{const p=byId(pid);const nn=tx(n);return `<label class="step ${done.has(id)?"done":""}"><input type="checkbox" data-id="${id}" ${done.has(id)?"checked":""}><img class="sthumb" src="${IMG[pid]}" alt="${esc(p.n)}" loading="lazy"><div><div class="t">${esc(tx(t))}</div><div class="p">${esc(p.b+" "+p.n)}</div>${nn?`<div class="note">${esc(nn)}</div>`:""}</div></label>`}).join("")+"</div>").join("")}
function renderT(){
 $("tlist").innerHTML=T.map((g,gi)=>`<h2>${esc(tx(g.t))}</h2><div class="card">`+g.i.map(([a,b],ii)=>{const ps=TP[gi+"-"+ii]||[];return `<div class="tipc"><b>${esc(tx(a))}</b><span>${esc(tx(b))}</span>${ps.length?`<div class="pics">${ps.map(id=>`<img class="mini" src="${IMG[id]}" alt="${esc(byId(id).n)}" title="${esc(byId(id).b+" "+byId(id).n)}" loading="lazy">`).join("")}</div>`:""}</div>`}).join("")+"</div>").join("")}
function renderUI(){
 document.documentElement.lang=lang?"en":"ms";
 $("sub").textContent=tx(UI.sub);$("q").placeholder=tx(UI.search);$("reset").textContent=tx(UI.reset);
 $("d1").textContent=tx(UI.d1);$("d2").textContent=tx(UI.d2);
 document.querySelectorAll("nav button").forEach((b,i)=>b.textContent=tx(UI.nav[i]));
 $("lm").setAttribute("aria-pressed",!lang);$("le").setAttribute("aria-pressed",!!lang);
 renderP();renderR();renderT()}
function setLang(n){lang=n;try{localStorage.setItem("kk-lang",n?"en":"ms")}catch(e){}renderUI()}
$("lm").onclick=()=>setLang(0);$("le").onclick=()=>setLang(1);
$("rlist").addEventListener("change",e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?done.add(id):done.delete(id);save();renderR()});
$("reset").onclick=()=>{done.clear();save();renderR()};
$("q").addEventListener("input",renderP);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.setAttribute("aria-selected",x===b));document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));scrollTo(0,0)});
/* background collage from the product photos (repeat to fill) */
$("bggrid").innerHTML=[...Object.values(IMG),...Object.values(IMG).reverse(),...Object.values(IMG)].map(s=>`<img src="${s}" alt="">`).join("");
renderUI();
